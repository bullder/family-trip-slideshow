<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>%%PLACE%% %%YEAR%% — Opening (vertical)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Kaushan Script";
        src: url("assets/fonts/KaushanScript-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/Manrope-VF.ttf") format("truetype");
        font-weight: 200 800;
      }
      :root { --cream: #fff4e4; --night: #12141c; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--night); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      #photo-wrap { overflow: hidden; }
      /* group photo filling the full height, panned along the chain of hands */
      #photo {
        position: absolute; left: 0; top: 0; width: %%PHOTO_W%%px; height: 1920px;
        object-fit: cover; filter: saturate(0.88) contrast(0.97) brightness(1.03) sepia(0.1);
      }
      #warm { background: rgba(255,150,110,0.22); mix-blend-mode: soft-light; }
      #shade {
        background: linear-gradient(180deg, rgba(18,20,28,0.35) 0%, rgba(18,20,28,0) 22%, rgba(18,20,28,0) 44%, rgba(18,20,28,0.5) 62%, rgba(18,20,28,0.62) 72%, rgba(18,20,28,0.3) 100%);
      }
      #type {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding-bottom: 160px; color: var(--cream); text-align: center;
      }
      .kicker {
        display: flex; align-items: center; justify-content: center; gap: 24px;
        font-family: "Manrope"; font-weight: 600; font-size: 30px; letter-spacing: 0.38em;
        text-transform: uppercase; text-indent: 0.38em;
      }
      .rule { display: block; width: 70px; height: 3px; background: #f0485a; }
      #title-mask { display: block; overflow: hidden; padding: 0 40px 30px; margin-top: 10px; }
      #title { display: block; font-family: "Kaushan Script"; font-size: 200px; line-height: 1.05; text-shadow: 0 8px 40px rgba(18,20,28,0.35); }
      #year {
        display: flex; gap: 26px; margin-top: -18px;
        font-family: "Manrope"; font-weight: 800; font-size: 72px; letter-spacing: 0.06em;
      }
      #year span { display: inline-block; width: 50px; text-align: center; }
      #names { margin-top: 40px; font-weight: 500; font-size: 32px; letter-spacing: 0.4em; }
      #names i { font-style: normal; opacity: 0.7; padding: 0 4px; }
      /* one name at a time as the camera passes each person */
      .who {
        position: absolute; left: 0; right: 0; top: 1240px; text-align: center;
        font-family: "Kaushan Script"; font-size: 150px; line-height: 1; color: var(--cream); opacity: 0;
        text-shadow: 0 6px 36px rgba(18,20,28,0.45);
      }
      #fade { background: var(--night); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="%%DUR%%" data-width="1080" data-height="1920">
      <div id="photo-wrap" class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="0">
        <img id="photo" src="assets/%%PHOTO%%" alt="" />
      </div>
      <div id="warm" class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="1"></div>
      <div id="shade" class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="2"></div>
      <div id="type" class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="3">
        <div class="kicker" id="kicker"><span class="rule" id="rule-l"></span><span>%%KICKER%%</span><span class="rule" id="rule-r"></span></div>
        <div id="title-mask"><span id="title">%%PLACE%%</span></div>
        <div id="year">%%YEAR_SPANS%%</div>
        <div class="kicker" id="names">%%NAMES_HTML%%</div>
      </div>
      <div id="who-layer" class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="4">
%%WHO_HTML%%
      </div>
      <div id="fade" class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="5"></div>
    </div>
    <script>
      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        // timings were authored for an 8.3 s intro / 7.5 s outro; T() stretches them to this track's bars
        const S = %%SCALE%%;
        const T = (t) => +(t * S).toFixed(3);
        // x that centres a person at fraction p of the photo width in the 1080px frame
        const W = %%PHOTO_W%%;
        const at = (p) => Math.max(1080 - W, Math.min(0, 540 - p * W));
        tl.fromTo("#fade", { opacity: 1 }, { opacity: 0, duration: 1.2, ease: "power2.out" }, T(0));
        // Lockup over the blurred chain
        tl.fromTo("#photo", { filter: "blur(26px) brightness(0.6) saturate(0.95) sepia(0.1)" },
          { filter: "blur(0px) brightness(1.03) saturate(0.88) sepia(0.1)", duration: 0.9, ease: "power2.inOut" }, T(3.6));
        tl.fromTo("#kicker", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 1.2, ease: "expo.out" }, T(0.5));
        tl.fromTo(["#rule-l", "#rule-r"], { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "expo.out" }, T(0.8));
        tl.fromTo("#title", { clipPath: "inset(0 100% 0 0)", y: 30, rotation: -4 },
          { clipPath: "inset(0 0% 0 0)", y: 0, rotation: -3, duration: 1.2, ease: "power3.inOut" }, T(0.9));
        tl.fromTo("#year span", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(2)", stagger: 0.31 }, T(1.8));
        tl.fromTo("#names", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, T(2.6));
        tl.to("#type", { opacity: 0, y: -24, duration: 0.5, ease: "power2.in" }, T(3.5));
        // Walk the chain left to right, one person per beat-sized stop, naming each as they pass
        const chain = %%CHAIN%%;
        const t0 = T(4.15), end = %%DUR%% - 0.3, seg = (end - t0) / chain.length;
        tl.fromTo("#photo", { x: at(chain[0].x) }, { x: at(chain[0].x), duration: 0.01 }, 0);
        chain.forEach((c, i) => {
          const a = t0 + i * seg;
          if (i > 0) tl.to("#photo", { x: at(c.x), duration: 0.309, ease: "power2.inOut" }, +(a - 0.3).toFixed(3));
          tl.fromTo(`#who-${i}`, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, +(a + 0.02).toFixed(3));
          if (i < chain.length - 1) tl.to(`#who-${i}`, { opacity: 0, y: -16, duration: 0.2, ease: "power2.in" }, +(a + seg - 0.42).toFixed(3));
        });
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
