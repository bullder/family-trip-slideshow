<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>%%PLACE%% %%YEAR%% — Finale</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Kaushan Script";
        src: url("assets/fonts/KaushanScript-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/Manrope-VF.ttf") format("truetype");
        font-weight: 200 800;
      }
      :root { --cream: #fff4e4; --coral: #f0485a; --amber: #f2a24a; --night: #12141c; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--night); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--night); }
      .layer { position: absolute; inset: 0; }
      #bg {
        background:
          radial-gradient(70% 60% at 50% 30%, rgba(242,162,74,0.22) 0%, rgba(242,162,74,0) 70%),
          var(--night);
      }
      #card {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,0.55);
      }
      #photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; filter: saturate(0.9) sepia(0.08); }
      #type {
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        padding-bottom: 92px; color: var(--cream); text-align: center;
      }
      .kicker {
        display: flex; align-items: center; gap: 26px;
        font-family: "Manrope"; font-weight: 600; font-size: 24px; letter-spacing: 0.42em;
        text-transform: uppercase; text-indent: 0.42em;
      }
      .rule { display: block; width: 80px; height: 2px; background: var(--amber); }
      #title-mask { display: block; overflow: hidden; padding: 0 50px 18px; margin-top: 4px; }
      #title { display: block; font-family: "Kaushan Script"; font-size: 132px; line-height: 1.1; }
      #names { margin-top: 18px; font-size: 24px; letter-spacing: 0.5em; font-weight: 500; }
      #names i { font-style: normal; opacity: 0.6; padding: 0 4px; }
      #fade { background: #000; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="%%DUR%%" data-width="1920" data-height="1080">
      <div id="bg" class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="0"></div>
      <div class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="1">
        <div id="card"><img id="photo" src="assets/%%PHOTO%%" alt="" /></div>
      </div>
      <div id="type" class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="2">
        <div class="kicker" id="kicker"><span class="rule" id="rule-l"></span><span>%%KICKER%%</span><span class="rule" id="rule-r"></span></div>
        <div id="title-mask"><span id="title">%%TITLE%%</span></div>
        <div class="kicker" id="names">%%NAMES_HTML%%</div>
      </div>
      <div id="fade" class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="3"></div>
    </div>
    <script>
      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        // timings were authored for an 8.3 s intro / 7.5 s outro; T() stretches them to this track's bars
        const S = %%SCALE%%;
        const T = (t) => +(t * S).toFixed(3);
        // Full-bleed sunset pulls back into a framed print, lifting to make room for the words
        tl.fromTo("#card", { scale: 1, y: 0, borderRadius: 0 },
          { scale: 0.6, y: -150, borderRadius: 10, duration: 2.2, ease: "power3.inOut" }, T(0.3));
        tl.fromTo("#photo", { scale: 1.04 }, { scale: 1.12, duration: %%DUR%%, ease: "none" }, T(0));
        tl.fromTo("#kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, T(1.9));
        tl.fromTo(["#rule-l", "#rule-r"], { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.out" }, T(2.1));
        tl.fromTo("#title", { clipPath: "inset(0 100% 0 0)", y: 20, rotation: -3 },
          { clipPath: "inset(0 0% 0 0)", y: 0, rotation: -2, duration: 1.3, ease: "power3.inOut" }, T(2.4));
        tl.fromTo("#names", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, T(3.5));
        tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "power1.in" }, %%FADE_AT%%);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
