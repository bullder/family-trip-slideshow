<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>%%PLACE%% %%YEAR%% — Opening</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Kaushan Script";
        src: url("assets/fonts/KaushanScript-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/Manrope-VF.ttf") format("truetype");
        font-weight: 200 800;
      }
      :root {
        --cream: #fff4e4;
        --coral: #f0485a;
        --night: #12141c;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--night); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      #photo-wrap { overflow: hidden; }
      #photo {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; object-position: %%FOCUS%%;
        filter: saturate(0.88) contrast(0.97) brightness(1.03) sepia(0.1);
      }
      #shade {
        background:
          linear-gradient(180deg, rgba(18,20,28,0.55) 0%, rgba(18,20,28,0) 38%, rgba(18,20,28,0) 52%, rgba(18,20,28,0.82) 100%),
          radial-gradient(120% 80% at 50% 45%, rgba(18,20,28,0) 40%, rgba(18,20,28,0.45) 100%);
      }
      #leak {
        background: radial-gradient(40% 55% at 50% 50%, rgba(255,150,90,0.55) 0%, rgba(240,72,90,0.28) 45%, rgba(240,72,90,0) 75%);
        mix-blend-mode: screen; opacity: 0;
        width: 1400px; height: 1400px; left: -700px; top: -360px; right: auto; bottom: auto;
      }
      #type {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding-bottom: 60px; color: var(--cream); text-align: center;
      }
      .kicker {
        display: flex; align-items: center; gap: 28px;
        font-family: "Manrope"; font-weight: 600; font-size: 24px; letter-spacing: 0.42em;
        text-transform: uppercase; text-indent: 0.42em;
      }
      .rule { display: block; width: 90px; height: 2px; background: var(--coral); }
      #title-mask { display: block; overflow: hidden; padding: 0 60px 40px; margin-top: 12px; }
      #title {
        display: block; font-family: "Kaushan Script"; font-size: 236px; line-height: 1.05;
        text-shadow: 0 8px 40px rgba(18,20,28,0.35);
      }
      #year {
        display: flex; gap: 26px; margin-top: -26px;
        font-family: "Manrope"; font-weight: 800; font-size: 64px; letter-spacing: 0.06em; color: var(--cream);
      }
      #year span { display: inline-block; width: 44px; text-align: center; }
      #names { margin-top: 40px; color: var(--cream); font-size: 30px; letter-spacing: 0.5em; font-weight: 500; }
      #names i { font-style: normal; color: var(--cream); opacity: 0.7; padding: 0 6px; }
      #fade { background: var(--night); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="%%DUR%%" data-width="1920" data-height="1080">
      <div id="photo-wrap" class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="0">
        <img id="photo" src="assets/%%PHOTO%%" alt="" />
      </div>
      <div id="warm" class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="5" style="background: rgba(255,150,110,0.22); mix-blend-mode: soft-light"></div>
      <div id="shade" class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="1"></div>
      <div class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="2" style="overflow:hidden">
        <div id="leak" class="layer"></div>
      </div>
      <div id="type" class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="3">
        <div class="kicker" id="kicker"><span class="rule" id="rule-l"></span><span>%%KICKER%%</span><span class="rule" id="rule-r"></span></div>
        <div id="title-mask"><span id="title">%%PLACE%%</span></div>
        <div id="year">%%YEAR_SPANS%%</div>
        <div class="kicker" id="names">%%NAMES_HTML%%</div>
      </div>
      <div id="fade" class="layer clip" data-start="0" data-duration="%%DUR%%" data-track-index="4"></div>
    </div>
    <script>
      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        // timings were authored for an 8.3 s intro / 7.5 s outro; T() stretches them to this track's bars
        const S = %%SCALE%%;
        const T = (t) => +(t * S).toFixed(3);
        // Photo: slow push-in + drift, opens from black
        tl.fromTo("#photo", { scale: 1.18, xPercent: -1.5 }, { scale: 1.05, xPercent: 1, duration: %%DUR%%, ease: "power1.out" }, T(0));
        tl.fromTo("#photo", { filter: "blur(22px) brightness(0.62) saturate(0.95) sepia(0.1)" }, { filter: "blur(0px) brightness(1.03) saturate(0.88) sepia(0.1)", duration: 1.5, ease: "power2.inOut" }, T(4.0));
        // the lockup settles into the lower band as the photo comes into focus
        tl.fromTo("#type", { y: 0, scale: 1 }, { y: 318, scale: 0.56, duration: 1.5, ease: "power3.inOut" }, T(4.0));
        tl.fromTo("#fade", { opacity: 1 }, { opacity: 0, duration: 1.4, ease: "power2.out" }, T(0));
        // Sunset leak sweeps across
        tl.fromTo("#leak", { x: 0, y: 0 }, { x: 2300, y: 120, duration: 6.5, ease: "sine.inOut" }, T(0.4));
        tl.fromTo("#leak", { opacity: 0 }, { opacity: 1, duration: 1.6, ease: "sine.out" }, T(0.4));
        tl.to("#leak", { opacity: 0, duration: 1.2 }, T(6.0));
        // Kicker
        tl.fromTo("#kicker", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 1.4, ease: "expo.out" }, T(0.9));
        tl.fromTo(["#rule-l", "#rule-r"], { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "expo.out" }, T(1.2));
        // Brush title wipes in like a stroke, left to right
        tl.fromTo("#title", { clipPath: "inset(0 100% 0 0)", y: 30, rotation: -4 },
          { clipPath: "inset(0 0% 0 0)", y: 0, rotation: -3, duration: 1.3, ease: "power3.inOut" }, T(1.75));
        // Year digits pop on beats (~0.31 s apart)
        tl.fromTo("#year span", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(2)", stagger: 0.31 }, T(3.03));
        // Names
        tl.fromTo("#names", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, T(5.3));
        // Hand-off: type lifts away into slide 1
        tl.to("#type", { opacity: 0, duration: 0.6, ease: "power2.in" }, T(6.9));
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
